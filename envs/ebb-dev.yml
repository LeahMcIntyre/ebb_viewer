name: ebb-dev
channels: [conda-forge]
dependencies:
  - python=3.13
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - mne
  - pyqtgraph
  - pyqt6
  - psutil
  - requests
  - seaborn      # plots in analysis/psd_utils.py
  - jupyterlab  # to run the analysis notebooks
  - pip

  - pip:
      - fooof
      - openseize==1.3.0
      - pytest
      - ruff
