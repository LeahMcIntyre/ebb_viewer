[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebb-viewer"
version = "0.1.0"
description = "GUI application for the ebb EEG processing pipeline"
requires-python = ">=3.10"
dependencies = [
  "ebb",
  "PyQt6",
]

[project.scripts]
ebb-viewer = "ebb_viewer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
