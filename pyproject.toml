[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebb-suite"
version = "0.1.0"
description = "EEG processing pipeline (ebb) and GUI viewer (ebb_viewer)"
requires-python = ">=3.10"

dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "openseize",
]

# Command-line entry point to launch your viewer
[project.scripts]
ebb-viewer = "ebb_viewer.__main__:main"

[tool.setuptools]
# Tell setuptools that all packages live under src/
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle errors/warnings
  "F",        # pyflakes (dead imports, unused vars, undefined names)
  "I",        # isort (import sorting)
  "UP",       # pyupgrade (modern syntax)
  "B",        # bugbear (common pitfalls)
  "SIM",      # simplify (collapse trivially-simplifiable code)
]
ignore = ["E501"]  # line length handled by formatter